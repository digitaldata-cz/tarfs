name: Go
on:
  push:
    branches: [main]
    tags: ['v2.*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.22.x', stable]
        exclude:
          # The Go 1.22 internal linker cannot target current macOS loaders.
          - os: macos-latest
            go: '1.22.x'
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Format
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Benchmark smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -run '^$' -bench 'Benchmark(Open|Readdir|CompressedStream)$' -benchmem -benchtime=100ms
  examples:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go -C examples/gin test ./...
      - run: go -C examples/gin vet ./...
      - run: go -C examples/gin-advanced test ./...
      - run: go -C examples/gin-advanced vet ./...
  fuzz:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go test -run '^$' -fuzz '^FuzzArchive$' -fuzztime=15s -parallel=2
      - run: go test -run '^$' -fuzz '^FuzzCompressionRoundTrip$' -fuzztime=15s -parallel=2
  security:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # gosec 2.29 cannot read Go 1.27 export data yet.
          go-version: '1.26.x'
          cache: false
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
